<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1045" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1E3A5F" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowStrong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B4FA5"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="960" height="1045" fill="url(#bg)" rx="18"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" font-size="25" font-weight="800" fill="#0F172A">Model, Harness, and the Agent's Context Layer</text>
  <text x="480" y="70" text-anchor="middle" font-size="13.5" fill="#64748B">Harness and model evolve together. One context layer serves every harness.</text>

  <!-- ============ MODEL LAYER ============ -->
  <rect x="60" y="95" width="840" height="78" rx="14" fill="#F5EEFE" stroke="#7B4FA5" stroke-width="1.4"/>
  <text x="80" y="117" font-size="10.5" font-weight="700" fill="#7B4FA5" letter-spacing="1.4">MODEL LAYER</text>

  <g filter="url(#cardShadow)">
    <rect x="310" y="113" width="340" height="44" rx="9" fill="#FFFFFF" stroke="#7B4FA5" stroke-width="1.1"/>
    <circle cx="338" cy="135" r="8" fill="none" stroke="#7B4FA5" stroke-width="1.4"/>
    <path d="M338 129 A5.5 5.5 0 0 1 343.5 135" fill="none" stroke="#7B4FA5" stroke-width="1.4"/>
    <text x="356" y="140" font-size="13.5" font-weight="600" fill="#2E1A4C">Large Language Model</text>
  </g>

  <line x1="480" y1="157" x2="480" y2="188" stroke="#7B4FA5" stroke-width="2"/>
  <line x1="205" y1="188" x2="755" y2="188" stroke="#7B4FA5" stroke-width="2"/>
  <line x1="205" y1="188" x2="205" y2="214" stroke="#7B4FA5" stroke-width="2"
        marker-start="url(#arrowStrong)" marker-end="url(#arrowStrong)"/>
  <line x1="480" y1="188" x2="480" y2="214" stroke="#7B4FA5" stroke-width="2"
        marker-start="url(#arrowStrong)" marker-end="url(#arrowStrong)"/>
  <line x1="755" y1="188" x2="755" y2="214" stroke="#7B4FA5" stroke-width="2"
        marker-start="url(#arrowStrong)" marker-end="url(#arrowStrong)"/>

  <!-- ============ HARNESS LAYER ============ -->
  <rect x="60" y="214" width="840" height="143" rx="14" fill="#FFF7EC" stroke="#D68B2C" stroke-width="1.4"/>
  <text x="80" y="237" font-size="10.5" font-weight="700" fill="#D68B2C" letter-spacing="1.4">HARNESS LAYER</text>
  <text x="880" y="237" text-anchor="end" font-size="10.5" font-weight="600" fill="#B8741A">tightly coupled with model</text>

  <g filter="url(#cardShadow)">
    <rect x="85" y="250" width="240" height="82" rx="9" fill="#FFF3E0" stroke="#D68B2C" stroke-width="1.8"/>
    <circle cx="103" cy="268" r="4" fill="#D68B2C"/>
    <text x="117" y="273" font-size="12.5" font-weight="700" fill="#5C3A00">RAGFlow Harness</text>
    <text x="117" y="292" font-size="9.5" fill="#8A6A3A">reference implementation</text>
    <text x="117" y="312" font-size="9.5" font-weight="600" fill="#B8741A">ships with RAGFlow</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="360" y="250" width="240" height="82" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 3"/>
    <circle cx="378" cy="268" r="4" fill="#94A3B8"/>
    <text x="392" y="273" font-size="12.5" font-weight="600" fill="#475569">External Harness</text>
    <text x="392" y="292" font-size="9.5" fill="#64748B">e.g. LangGraph</text>
    <text x="392" y="312" font-size="9.5" font-weight="600" fill="#64748B">plugs into the layer</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="635" y="250" width="240" height="82" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 3"/>
    <circle cx="653" cy="268" r="4" fill="#94A3B8"/>
    <text x="667" y="273" font-size="12.5" font-weight="600" fill="#475569">Custom Harness</text>
    <text x="667" y="292" font-size="9.5" fill="#64748B">your own agent loop</text>
    <text x="667" y="312" font-size="9.5" font-weight="600" fill="#64748B">plugs into the layer</text>
  </g>

  <!-- Harness → bus -->
  <line x1="205" y1="332" x2="205" y2="368" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="480" y1="332" x2="480" y2="368" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="755" y1="332" x2="755" y2="368" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="205" y1="368" x2="755" y2="368" stroke="#94A3B8" stroke-width="1.6"/>

  <!-- Bus → Context -->
  <line x1="480" y1="368" x2="480" y2="448" stroke="#94A3B8" stroke-width="1.8"
        marker-start="url(#arrowSoft)" marker-end="url(#arrowSoft)"/>

  <!-- Agent Loop pill -->
  <g filter="url(#cardShadow)">
    <rect x="508" y="384" width="188" height="44" rx="22" fill="#1F6F4A"/>
  </g>
  <g transform="translate(520, 396) scale(0.85)">
    <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="#FFFFFF"/>
  </g>
  <text x="550" y="404" font-size="11.5" font-weight="800" fill="#FFFFFF" letter-spacing="1">AGENT LOOP</text>
  <text x="550" y="419" font-size="9" fill="#B9E3CB">tool call → result → repeat</text>

  <!-- ============ CONTEXT LAYER ============ -->
  <rect x="60" y="448" width="840" height="390" rx="16" fill="#EAF6EE" stroke="#2F8C57" stroke-width="1.6"/>

  <text x="80" y="472" font-size="10.5" font-weight="700" fill="#2F8C57" letter-spacing="1.4">CONTEXT LAYER</text>
  <text x="480" y="472" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3D2A" font-style="italic">queried by the agent loop, not stuffed into a prompt</text>
  <g>
    <rect x="820" y="455" width="80" height="24" rx="12" fill="#2F8C57"/>
    <text x="860" y="472" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">RAGFlow</text>
  </g>

  <!-- Query Interface -->
  <g filter="url(#cardShadow)">
    <rect x="85" y="492" width="790" height="48" rx="9" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1.4"/>
    <g transform="translate(103, 505)">
      <circle cx="6" cy="6" r="3" fill="#2F8C57"/>
      <circle cx="6" cy="16" r="3" fill="#2F8C57"/>
      <path d="M9 6 Q18 6 18 11 Q18 16 9 16" fill="none" stroke="#2F8C57" stroke-width="1.3"/>
    </g>
    <text x="132" y="521" font-size="11.5" font-weight="700" fill="#1E3D2A">Query Interface</text>
    <text x="248" y="521" font-size="10" fill="#5F7A6B">tools · search · grep · read</text>
    <rect x="760" y="501" width="100" height="26" rx="6" fill="#EAF6EE" stroke="#2F8C57" stroke-width="1"/>
    <text x="810" y="518" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2F8C57">query · result</text>
  </g>

  <text x="85" y="566" font-size="9.5" font-weight="700" fill="#5F7A6B" letter-spacing="1">COLLECTIONS</text>

  <g filter="url(#cardShadow)">
    <rect x="85" y="576" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1"/>
    <rect x="85" y="576" width="250" height="18" rx="8" fill="#EAF6EE"/>
    <rect x="85" y="586" width="250" height="8" fill="#EAF6EE"/>
    <text x="99" y="590" font-size="9" font-weight="700" fill="#2F8C57" letter-spacing="0.8">EVIDENCE</text>
    <text x="99" y="612" font-size="11.5" font-weight="700" fill="#1E3D2A">claim + verbatim span</text>
    <text x="99" y="632" font-size="9.5" fill="#5F7A6B">−91% tokens on hit</text>

    <rect x="355" y="576" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1"/>
    <rect x="355" y="576" width="250" height="18" rx="8" fill="#EAF6EE"/>
    <rect x="355" y="586" width="250" height="8" fill="#EAF6EE"/>
    <text x="369" y="590" font-size="9" font-weight="700" fill="#2F8C57" letter-spacing="0.8">NAVIGATION</text>
    <text x="369" y="612" font-size="11.5" font-weight="700" fill="#1E3D2A">tree with claim leaves</text>
    <text x="369" y="632" font-size="9.5" fill="#5F7A6B">topic → leaf drill-down</text>

    <rect x="625" y="576" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1"/>
    <rect x="625" y="576" width="250" height="18" rx="8" fill="#EAF6EE"/>
    <rect x="625" y="586" width="250" height="8" fill="#EAF6EE"/>
    <text x="639" y="590" font-size="9" font-weight="700" fill="#2F8C57" letter-spacing="0.8">RELATIONS</text>
    <text x="639" y="612" font-size="11.5" font-weight="700" fill="#1E3D2A">entity graph</text>
    <text x="639" y="632" font-size="9.5" fill="#5F7A6B">cross-source joins</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="85" y="662" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1"/>
    <rect x="85" y="662" width="250" height="18" rx="8" fill="#EAF6EE"/>
    <rect x="85" y="672" width="250" height="8" fill="#EAF6EE"/>
    <text x="99" y="676" font-size="9" font-weight="700" fill="#2F8C57" letter-spacing="0.8">TEMPORAL</text>
    <text x="99" y="698" font-size="11.5" font-weight="700" fill="#1E3D2A">timeline</text>
    <text x="99" y="718" font-size="9.5" fill="#5F7A6B">event order &amp; as-of reads</text>

    <rect x="355" y="662" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1"/>
    <rect x="355" y="662" width="250" height="18" rx="8" fill="#EAF6EE"/>
    <rect x="355" y="672" width="250" height="8" fill="#EAF6EE"/>
    <text x="369" y="676" font-size="9" font-weight="700" fill="#2F8C57" letter-spacing="0.8">SYNTHESIS</text>
    <text x="369" y="698" font-size="11.5" font-weight="700" fill="#1E3D2A">LLM wiki</text>
    <text x="369" y="718" font-size="9.5" fill="#5F7A6B">linked, cited articles</text>

    <rect x="625" y="662" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1"/>
    <rect x="625" y="662" width="250" height="18" rx="8" fill="#EAF6EE"/>
    <rect x="625" y="672" width="250" height="8" fill="#EAF6EE"/>
    <text x="639" y="676" font-size="9" font-weight="700" fill="#2F8C57" letter-spacing="0.8">STATE</text>
    <text x="639" y="698" font-size="11.5" font-weight="700" fill="#1E3D2A">memory</text>
    <text x="639" y="718" font-size="9.5" fill="#5F7A6B">durable session facts</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="85" y="754" width="790" height="48" rx="9" fill="#FFFFFF" stroke="#2F8C57" stroke-width="1.1"/>
    <text x="103" y="774" font-size="9.5" font-weight="700" fill="#5F7A6B" letter-spacing="1">GOVERNANCE</text>
    <text x="103" y="792" font-size="10.5" fill="#1E3D2A">versioned snapshots · lineage · access control · audit trail</text>
    <rect x="700" y="764" width="160" height="28" rx="6" fill="#EAF6EE" stroke="#2F8C57" stroke-width="1"/>
    <text x="780" y="782" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2F8C57">like data, not prompts</text>
  </g>

  <text x="480" y="826" text-anchor="middle" font-size="10" fill="#5F7A6B">Compiled once, queried many times: the context layer behaves like a database, not a prompt stuffer.</text>

  <!-- ============ INGEST + COMPILE connection ============ -->
  <!-- Same gray thin line + arrowSoft marker as Harness→Context, pointing UP -->
  <line x1="480" y1="898" x2="480" y2="838" stroke="#94A3B8" stroke-width="1.8"
        marker-end="url(#arrowSoft)"/>

  <!-- INGEST + COMPILE label to the right of the line -->
  <g filter="url(#cardShadow)">
    <rect x="500" y="851" width="200" height="32" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  </g>
  <text x="600" y="872" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">INGEST + COMPILE</text>

  <!-- ============ RAW DATA LAYER ============ -->
  <rect x="60" y="900" width="840" height="100" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="80" y="922" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="1.4">RAW DATA LAYER</text>
  <text x="880" y="922" text-anchor="end" font-size="9.5" fill="#94A3B8">source of truth · read-only · never overwritten</text>

  <g font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">
    <g filter="url(#cardShadow)">
      <rect x="90" y="935" width="120" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    </g>
    <text x="150" y="965">Documents</text>

    <g filter="url(#cardShadow)">
      <rect x="222" y="935" width="120" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    </g>
    <text x="282" y="965">Tables</text>

    <g filter="url(#cardShadow)">
      <rect x="354" y="935" width="120" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    </g>
    <text x="414" y="965">Logs</text>

    <g filter="url(#cardShadow)">
      <rect x="486" y="935" width="120" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    </g>
    <text x="546" y="965">Sessions</text>

    <g filter="url(#cardShadow)">
      <rect x="618" y="935" width="120" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    </g>
    <text x="678" y="965">Databases</text>

    <g filter="url(#cardShadow)">
      <rect x="750" y="935" width="120" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    </g>
    <text x="810" y="965">APIs</text>
  </g>

  <text x="480" y="1030" text-anchor="middle" font-size="10.5" fill="#5F7A6B">Raw data stays raw. Compilation produces typed, versioned, auditable artifacts — and the agent queries those artifacts, not the files.</text>
</svg>