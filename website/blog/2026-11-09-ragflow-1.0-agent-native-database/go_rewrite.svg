<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Inter', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="420" fill="url(#bg1)" rx="16"/>

  <!-- 标题 -->
  <text x="450" y="60" text-anchor="middle" font-size="24" font-weight="800" fill="#0F172A">RAGFlow 1.0: Built for Agent Infra</text>
  <text x="450" y="88" text-anchor="middle" font-size="14" fill="#64748B">Go Rewrite: The Foundation for Agent Native Database</text>

  <!-- 卡片 1：并发能力 -->
  <g filter="url(#shadow1)">
    <rect x="60" y="130" width="240" height="220" rx="16" fill="url(#card1)" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <circle cx="180" cy="180" r="24" fill="#EFF6FF" />
  <path d="M180 165 L180 185 M175 180 L185 180" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="240" text-anchor="middle" font-size="48" font-weight="800" fill="#1E3A8A">&gt; 100×</text>
  <text x="180" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Retrieval Concurrency</text>
  <text x="180" y="305" text-anchor="middle" font-size="12" fill="#64748B">Over 2 orders of magnitude</text>

  <!-- 卡片 2：启动速度 -->
  <g filter="url(#shadow1)">
    <rect x="330" y="130" width="240" height="220" rx="16" fill="url(#card1)" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <circle cx="450" cy="180" r="24" fill="#EFF6FF" />
  <path d="M450 170 A 10 10 0 1 1 440 180" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <polygon points="440,176 440,184 446,180" fill="#3B82F6"/>
  <text x="450" y="240" text-anchor="middle" font-size="48" font-weight="800" fill="#1E3A8A">&gt; 10×</text>
  <text x="450" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Faster Startup</text>
  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#64748B">1 order of magnitude lower</text>

  <!-- 卡片 3：容器镜像 -->
  <g filter="url(#shadow1)">
    <rect x="600" y="130" width="240" height="220" rx="16" fill="url(#card1)" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <circle cx="720" cy="180" r="24" fill="#EFF6FF" />
  <rect x="710" y="170" width="20" height="20" rx="4" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <line x1="715" y1="175" x2="725" y2="175" stroke="#3B82F6" stroke-width="2"/>
  <text x="720" y="240" text-anchor="middle" font-size="48" font-weight="800" fill="#1E3A8A">&gt; 10×</text>
  <text x="720" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Smaller Image Size</text>
  <text x="720" y="305" text-anchor="middle" font-size="12" fill="#64748B">Lower deployment barrier</text>

  <!-- 底部说明 -->
  <text x="450" y="390" text-anchor="middle" font-size="13" fill="#94A3B8">Python is for PoCs, Go is for Infra. Ready for 7×24 production workloads.</text>
</svg>