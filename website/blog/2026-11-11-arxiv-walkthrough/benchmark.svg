<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Inter', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="url(#bg2)" rx="16"/>
  
  <text x="450" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">Impressive Results from a Minimal Baseline</text>
  <text x="450" y="80" text-anchor="middle" font-size="14" fill="#64748B">Using Only BM25 + Grep + MiniMax-M3 (No Vector Index or Structured Artifacts)</text>

  <g filter="url(#shadow2)">
    <rect x="100" y="130" width="320" height="200" rx="16" fill="url(#cardBlue)" stroke="#BAE6FD" stroke-width="2"/>
  </g>
  <text x="260" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#0284C7">BrowseComp-Plus</text>
  <text x="260" y="275" text-anchor="middle" font-size="64" font-weight="800" fill="#1E3A8A">85%</text>
  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#64748B">Massive-Scale Multi-Hop Retrieval</text>

  <g filter="url(#shadow2)">
    <rect x="480" y="130" width="320" height="200" rx="16" fill="url(#cardBlue)" stroke="#BAE6FD" stroke-width="2"/>
  </g>
  <text x="640" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#0284C7">FRAMES</text>
  <text x="640" y="275" text-anchor="middle" font-size="64" font-weight="800" fill="#1E3A8A">91%</text>
  <text x="640" y="310" text-anchor="middle" font-size="13" fill="#64748B">Complex Multi-Hop Reasoning</text>
</svg>