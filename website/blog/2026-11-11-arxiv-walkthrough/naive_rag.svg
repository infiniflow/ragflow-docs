<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Inter', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg1)" rx="16"/>
  <text x="450" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">From "Single-Pass Match" to "Agent Loop"</text>

  <!-- 左侧：朴素 RAG -->
  <g filter="url(#shadow1)">
    <rect x="50" y="100" width="360" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <text x="230" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#64748B">Naive RAG</text>
  <text x="230" y="165" text-anchor="middle" font-size="13" fill="#94A3B8">A gamble in the dark</text>

  <g>
    <!-- Node 1 -->
    <rect x="80" y="200" width="100" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="130" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">User Query</text>
    <line x1="180" y1="220" x2="230" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <!-- Node 2 -->
    <rect x="240" y="200" width="120" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="300" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Vector Search</text>
    <line x1="360" y1="220" x2="400" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <!-- Node 3 -->
    <rect x="130" y="340" width="180" height="40" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="220" y="365" text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">Stuff into Prompt</text>
    <path d="M300,240 L300,300 L220,300 L220,335" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  </g>

  <!-- 右侧：Agent 循环 -->
  <g filter="url(#shadow1)">
    <rect x="490" y="100" width="360" height="340" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="670" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Agentic Search Harness</text>
  <text x="670" y="165" text-anchor="middle" font-size="13" fill="#3B82F6">Multi-step exploration, autonomous correction</text>

  <g>
    <!-- 循环图 -->
    <circle cx="670" cy="270" r="70" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="670" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">LLM Agent</text>
    <text x="670" y="285" text-anchor="middle" font-size="12" fill="#3B82F6">Autonomous Decisions</text>

    <path d="M 600 230 A 90 90 0 0 1 740 230" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="670" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">Search (Query)</text>

    <path d="M 740 310 A 90 90 0 0 1 600 310" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="670" y="365" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">Read &amp; Reformulate</text>
  </g>
</svg>